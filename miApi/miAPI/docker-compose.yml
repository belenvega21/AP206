version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ServerAPI
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:123456@postgres:5432/DB_miapi
    restart: always

  postgres:
    image: postgres:15
    container_name: ServerBD
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: DB_miapi
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DB_miapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: